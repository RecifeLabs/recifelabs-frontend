<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recife Labs — Controle IoT em Tempo Real</title>
  <!-- Biblioteca MQTT.js via CDN para conexão WebSocket no Browser -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Biblioteca QRCode.js para gerar o acesso instantâneo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --accent: #00f5a0;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 245, 160, 0.1);
      color: var(--accent);
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .led-indicator {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: #1e293b;
      border: 2px solid #334155;
      transition: all 0.3s ease;
    }
    .led-indicator.on {
      background: #38bdf8;
      border-color: #7dd3fc;
      box-shadow: 0 0 30px #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #0b0f19;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .qr-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed #334155;
    }
    #qrcode {
      background: #ffffff;
      padding: 10px;
      display: inline-block;
      border-radius: 8px;
      margin-top: 10px;
    }
    .status { font-size: 12px; margin-top: 16px; color: var(--muted); }
    .device-status {
      margin: 12px auto 0;
      font-size: 12px;
      line-height: 16px;
      color: var(--muted);
    }
    .device-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .device-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #1e293b;
      border-radius: 8px;
      text-align: left;
    }
    .device-info {
      min-width: 0;
    }
    .device-name {
      display: block;
      color: var(--text);
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .device-meta {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .device-radio {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: #64748b;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    .signature {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
    }
    .signature a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">recife-labs://telemetry</span>
    <h1>Controle LED D2</h1>
    <p>Comunicação via MQTT sobre WebSocket</p>

    <!-- Representação visual do LED físico -->
    <div id="ledVisual" class="led-indicator"></div>

    <button id="toggleBtn" disabled>Conectando ao Broker...</button>
    <div id="statusText" class="status">Status: Inicializando...</div>
    <div class="device-status">
      <span id="deviceStatusText">Dispositivos: aguardando sinal</span>
      <div id="deviceList" class="device-list"></div>
    </div>

    <!-- Área do QR Code para controle pelo celular -->
    <div class="qr-section">
      <p style="margin-bottom: 6px;">Escaneie para controlar pelo celular:</p>
      <div id="qrcode"></div>
    </div>
    <p class="signature">Feito com ❤️ e muito ☕ por Relton Lima na <a href="https://labs.recife.br/" target="_blank" rel="noopener noreferrer">labs.recife.br</a>.</p>
  </div>

  <script>
    // Tópico MQTT exclusivo (o aluno pode personalizar o ID para evitar conflito)
    const DEFAULT_TOPIC = 'recifelabs/iot/esp8266/led';
    let TOPIC = DEFAULT_TOPIC;
    // Broker público gratuito com suporte a WebSocket Seguro (WSS)
    const DEFAULT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    let BROKER_URL = DEFAULT_BROKER_URL;

    let ledState = false;
    const toggleBtn = document.getElementById('toggleBtn');
    const ledVisual = document.getElementById('ledVisual');
    const statusText = document.getElementById('statusText');
    const deviceStatusText = document.getElementById('deviceStatusText');
    const deviceList = document.getElementById('deviceList');
    const DEFAULT_STATUS_TOPIC = 'recifelabs/iot/+/status/#';
    const DEFAULT_DEVICE_SIGNAL_TIMEOUT = 15000;
    const DEFAULT_DEVICE_TOPICS = {
      esp32: {
        led: 'recifelabs/iot/esp32/led',
        status: 'recifelabs/iot/esp32/status/#'
      },
      esp8266: {
        led: 'recifelabs/iot/esp8266/led',
        status: 'recifelabs/iot/esp8266/status/#'
      }
    };
    let STATUS_TOPIC = DEFAULT_STATUS_TOPIC;
    let DEVICE_SIGNAL_TIMEOUT = DEFAULT_DEVICE_SIGNAL_TIMEOUT;
    let DEVICE_TOPICS = DEFAULT_DEVICE_TOPICS;
    const devices = new Map();
    const ledStates = new Map();
    let selectedDeviceKey = '';

    // 1. Usa o endereço público pelo qual esta página foi acessada.
    // Em produção, isso gera o QR Code com https://start.labs.recife.br.
    new QRCode(document.getElementById('qrcode'), {
      text: window.location.origin,
      width: 128,
      height: 128
    });

    // 2. Conecta o navegador diretamente ao Broker MQTT via WebSocket
    function connectMqtt() {
      const client = mqtt.connect(BROKER_URL, {
      clientId: 'recifelabs_web_' + Math.random().toString(16).substring(2, 8)
    });

      client.on('connect', () => {
        statusText.innerText = 'Status: Conectado via WebSocket';
        toggleBtn.disabled = devices.size === 0;
        updateUI();

        // Assina os comandos de LED e a presença dos dispositivos ESP32/ESP8266
        Object.values(DEVICE_TOPICS).forEach(deviceTopics => {
          client.subscribe(deviceTopics.led);
        });
        client.subscribe(STATUS_TOPIC);
      });

      client.on('error', (error) => {
        statusText.innerText = `Status: Erro MQTT - ${error.message}`;
        toggleBtn.disabled = true;
        console.error('Falha na conexão MQTT:', error);
      });

    // 3. Recebe atualizações em tempo real (sincroniza múltiplos navegadores)
      client.on('message', (topic, message) => {
        const ledDeviceType = Object.entries(DEVICE_TOPICS).find(([, deviceTopics]) =>
          topic === deviceTopics.led
        );

        if (ledDeviceType) {
          try {
            const payload = JSON.parse(message.toString());
            ledStates.set(ledDeviceType[0], payload.led === 'ON');
            if (getSelectedDeviceType() === ledDeviceType[0]) {
              ledState = ledStates.get(ledDeviceType[0]) || false;
            }
            updateUI();
          } catch (error) {
            console.warn('Estado do LED inválido:', error);
          }
          return;
        }

        const statusMatch = topic.match(/^recifelabs\/iot\/(esp32|esp8266)\/status\/(.+)$/);
        if (!statusMatch) {
          return;
        }

        try {
          const payload = JSON.parse(message.toString());
          if (!payload.status) {
            return;
          }

          const deviceType = statusMatch[1];
          const deviceId = payload.deviceId || statusMatch[2];
          const deviceStatus = payload.status === 'offline' ? 'offline' : 'online';
          const key = `${deviceType}:${deviceId}`;

          devices.set(key, {
            key,
            deviceType,
            deviceId,
            status: deviceStatus,
            lastSignal: Date.now()
          });
          updateDeviceList();
        } catch (error) {
          console.warn('Sinal de presença do dispositivo inválido:', error);
        }
      });

      setInterval(() => {
        let changed = false;
        devices.forEach(device => {
          if (device.status === 'online' &&
              Date.now() - device.lastSignal > DEVICE_SIGNAL_TIMEOUT) {
            device.status = 'offline';
            changed = true;
          }
        });
        if (changed) {
          updateDeviceList();
        }
      }, 1000);

    // 4. Publica o comando MQTT para a placa selecionada
      toggleBtn.addEventListener('click', () => {
      const selectedDeviceType = getSelectedDeviceType();
      if (!selectedDeviceType) {
        return;
      }
      const nextState = !ledState ? 'ON' : 'OFF';
      const payload = JSON.stringify({
        led: nextState,
        source: 'web-client',
        timestamp: Date.now()
        });

      // Publica com retain=true para manter o último estado salvo no broker
      client.publish(DEVICE_TOPICS[selectedDeviceType].led, payload, { qos: 1, retain: true });
    });
    }

    fetch('/api/network-info')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(config => {
        TOPIC = typeof config.topic === 'string' && config.topic
          ? config.topic
          : DEFAULT_TOPIC;
        BROKER_URL = typeof config.broker === 'string' && config.broker
          ? config.broker
          : DEFAULT_BROKER_URL;
        STATUS_TOPIC = typeof config.statusTopic === 'string' && config.statusTopic
          ? config.statusTopic
          : DEFAULT_STATUS_TOPIC;
        DEVICE_TOPICS = config.deviceTopics && typeof config.deviceTopics === 'object'
          ? { ...DEFAULT_DEVICE_TOPICS, ...config.deviceTopics }
          : DEFAULT_DEVICE_TOPICS;
        DEVICE_SIGNAL_TIMEOUT = Number.isFinite(config.deviceSignalTimeout)
          ? config.deviceSignalTimeout
          : DEFAULT_DEVICE_SIGNAL_TIMEOUT;
        if (typeof config.statusTopic !== 'string' || !Number.isFinite(config.deviceSignalTimeout)) {
          console.warn('Backend sem configuração de presença; usando valores padrão.');
        }
        connectMqtt();
      })
      .catch(error => {
        statusText.innerText = `Status: Erro de configuração - ${error.message}`;
        console.error('Falha ao carregar configuração MQTT:', error);
      });

    function updateUI() {
      if (ledState) {
        ledVisual.classList.add('on');
        toggleBtn.innerText = 'DESLIGAR LED D2';
      } else {
        ledVisual.classList.remove('on');
        toggleBtn.innerText = 'LIGAR LED D2';
      }
    }

    function getSelectedDeviceType() {
      return selectedDeviceKey ? selectedDeviceKey.split(':')[0] : '';
    }

    function updateDeviceList() {
      deviceList.replaceChildren();

      const orderedDevices = Array.from(devices.values()).sort((a, b) =>
        a.deviceType.localeCompare(b.deviceType) || a.deviceId.localeCompare(b.deviceId)
      );

      if (orderedDevices.length === 0) {
        deviceStatusText.innerText = 'Dispositivos: aguardando sinal';
        selectedDeviceKey = '';
        toggleBtn.disabled = true;
        return;
      }

      if (!orderedDevices.some(device => device.key === selectedDeviceKey)) {
        selectedDeviceKey = orderedDevices[0].key;
      }

      let onlineCount = 0;
      orderedDevices.forEach(device => {
        if (device.status === 'online') {
          onlineCount++;
        }

        const item = document.createElement('div');
        item.className = 'device-item';

        const dot = document.createElement('span');
        dot.className = 'status-dot';
        if (device.status === 'online') {
          dot.classList.add('online');
        }

        const info = document.createElement('div');
        info.className = 'device-info';

        const name = document.createElement('span');
        name.className = 'device-name';
        name.innerText = `${device.deviceType.toUpperCase()} · ${device.deviceId}`;

        const meta = document.createElement('span');
        meta.className = 'device-meta';
        meta.innerText = device.status === 'online' ? 'Conectado' : 'Desconectado';

        const radio = document.createElement('input');
        radio.className = 'device-radio';
        radio.type = 'radio';
        radio.name = 'selected-device';
        radio.value = device.key;
        radio.checked = device.key === selectedDeviceKey;
        radio.setAttribute('aria-label', `Selecionar ${device.deviceType} ${device.deviceId}`);
        radio.addEventListener('change', () => {
          selectedDeviceKey = radio.value;
          ledState = ledStates.get(getSelectedDeviceType()) || false;
          updateDeviceList();
        });

        info.appendChild(name);
        info.appendChild(meta);
        item.appendChild(dot);
        item.appendChild(info);
        item.appendChild(radio);
        deviceList.appendChild(item);
      });

      const selectedDeviceType = getSelectedDeviceType();
      ledState = ledStates.get(selectedDeviceType) || false;
      const selectedDevice = orderedDevices.find(device => device.key === selectedDeviceKey);
      toggleBtn.disabled = !selectedDevice || selectedDevice.status !== 'online';
      deviceStatusText.innerText =
        `${orderedDevices.length} dispositivo(s) identificado(s), ${onlineCount} conectado(s)`;
      updateUI();
    }
  </script>
</body>
</html>
